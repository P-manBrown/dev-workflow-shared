name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the sync tests
        run: bash sync/tests/run.sh

      - name: Run the tests of the shared scripts
        run: |
          status=0
          while IFS= read -r -d '' script; do
            printf '# %s\n' "$script"
            bash "$script" || status=1
          done < <(git ls-files -z -- ':(glob)files/all/**/tests/run.sh')
          exit "$status"

  checks:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A needed job finished with: $result" >&2
              exit 1
            fi
          done
