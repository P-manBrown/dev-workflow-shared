name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the sync tests
        run: bash sync/tests/run.sh

      - name: Run the tests of the shared scripts
        run: |
          status=0
          while IFS= read -r -d '' script; do
            printf '# %s\n' "$script"
            bash "$script" || status=1
          done < <(git ls-files -z -- ':(glob)files/all/**/tests/run.sh')
          exit "$status"

  shellcheck:
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"

      - name: Run ShellCheck
        run: |
          shellcheck="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          "$shellcheck" --version
          git ls-files -z -- '*.sh' | xargs -0 --no-run-if-empty "$shellcheck"

  checks:
    needs: [test, shellcheck]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A needed job finished with: $result" >&2
              exit 1
            fi
          done
